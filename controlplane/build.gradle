plugins {
    id 'org.springframework.boot' version '4.1.1'
}

description = 'Runnable Spring Boot controlplane application.'

// Spring AI 2.0.1's BOM still pins SDK 2.0.0. Pick up 2.0.1's bounded reads
// and callback/pagination fixes without changing the Spring integration API.
dependencyManagement {
    dependencies {
        dependency 'io.modelcontextprotocol.sdk:mcp:2.0.1'
        dependency 'io.modelcontextprotocol.sdk:mcp-core:2.0.1'
        dependency 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.0.1'
    }
}

dependencies {
    implementation project(':certificate')
    implementation project(':core')
    implementation project(':artifact')
    // The narrow, transport-neutral cross-module contract only
    // (FunctionVersionInvocationHandoff / DirectInvocationRequest /
    // DirectInvocationResult) - controlplane's own source cannot compile
    // against JdbcInvocationRegistry, InvocationRegistry, the persisted
    // Invocation record, the Dispatcher, or the Runtime Registry, because
    // none of them are even on this module's compile classpath.
    implementation project(':invocation-contract')
    // The invocation module's concrete FunctionVersionInvocationHandoff
    // implementation (see InvocationHandoffConfig) must be present on the
    // classpath for Spring to find and wire it at startup, but only at
    // runtime - controlplane's own code never compiles against it.
    runtimeOnly project(':invocation')
    // Same reasoning, for the dispatcher module's InvocationInspectionHandoff
    // implementation (see InvocationInspectionHandoffConfig) - step-level
    // inspection detail is dispatcher-owned data. slf4j-simple is excluded
    // because dispatcher runs standalone with it as its own SLF4J binding,
    // which would otherwise compete with controlplane's own log4j2 binding
    // on this module's runtime classpath.
    runtimeOnly(project(':dispatcher')) {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }

    // MCP server (Streamable HTTP transport) so agent/coding-assistant users
    // get the same capability surface as the REST API - see EPIC-15 in the
    // PRD. GA as of Spring AI 2.0.1, unlike the still-WIP/community
    // "MCP Security" convenience module, which is why auth for this endpoint
    // is a plain hand-rolled Spring Security filter (ApiKeyAuthenticationFilter)
    // mirroring JwtAuthenticationFilter, not Spring AI's own security starter.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // management.endpoints.web.exposure.include already lists "prometheus"
    // (see application.yml), but that endpoint does nothing without an
    // actual Micrometer registry implementation on the classpath - it was
    // exposed but non-functional before this.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // S3SourceStore - reuses the same S3-compatible store/credentials as
    // artifacts (app.artifact.*), just a different key prefix, so
    // production source storage doesn't have to live on ephemeral local
    // disk. See SourceStoreConfig.
    implementation 'software.amazon.awssdk:s3'
    implementation "dnsjava:dnsjava:${dnsjavaVersion}"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation "io.jsonwebtoken:jjwt-api:${jwtVersion}"
    // Verifies a Google Identity Services ID token server-side (signature,
    // expiry, audience) for the "Sign in with Google" admin login path - see
    // GoogleAuthService. No OAuth2 client/redirect flow needed: the frontend
    // already obtains a signed ID token directly from Google.
    implementation 'com.google.api-client:google-api-client:2.7.2'
    implementation 'org.apache.logging.log4j:log4j-layout-template-json'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jwtVersion}"

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-minio'
    // Only to create the S3 bucket the MinIOContainer starts without, before
    // Controlplane's real S3ArtifactPublisher (or the E2E test's own
    // in-process S3ArtifactStore) can use it - not transitively exposed by
    // implementation project(':artifact') above.
    testImplementation 'software.amazon.awssdk:s3'
    // Test-only cross-module visibility for STORY-M1-10's Zero-to-HTTP-Response
    // E2E test, which wires real Dispatcher/Runtime Worker/Gateway instances
    // in-process - this does NOT weaken the production runtimeOnly boundary
    // above (controlplane's own main source still cannot compile against
    // any of these), it only widens what the test source set can import.
    testImplementation project(':invocation')
    testImplementation project(':dispatcher')
    testImplementation project(':runtime')
    testImplementation project(':gateway')
    testImplementation project(':runtime-registry')
    testImplementation "io.nats:jnats:${natsVersion}"
    testImplementation 'io.netty:netty-buffer'
    testImplementation 'io.netty:netty-codec-http'
    testImplementation 'io.netty:netty-common'
    testImplementation 'io.netty:netty-handler'
    testImplementation 'io.netty:netty-codec'
    testImplementation 'io.netty:netty-transport'
}

tasks.named('test') {
    inputs.property('mcpSmokeEnabled', providers.environmentVariable('FUNCHOLE_TEST_MCP_SMOKE').getOrElse('false'))
    inputs.file(rootProject.file('scripts/dev/mcp-smoke.py'))
    useJUnitPlatform {
        excludeTags 'e2e'
    }
}

tasks.register('e2eTest', Test) {
    group = 'verification'
    description = 'Full Zero-to-HTTP-Response E2E (STORY-M1-10) - real Dispatcher/Runtime Worker/Gateway in-process, real Postgres/NATS/MinIO via testcontainers, real Node.js child process. Requires `node` on PATH and Docker.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
    }
}

springBoot {
    mainClass = 'com.funchole.backend.controlplane.FuncHoleBackendApplication'
}

tasks.named('bootJar') {
    archiveFileName = 'funchole-controlplane.jar'
}

tasks.named('jar') {
    enabled = false
}
