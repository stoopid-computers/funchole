spring:
  application:
    name: funchole-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/funchole}
    username: ${DB_USERNAME:funchole}
    password: ${DB_PASSWORD:funchole}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: funchole-mcp-server
        version: ${APP_VERSION:0.1.0-SNAPSHOT}
        instructions: >
          Build and ship websites, Node APIs, and shared-state apps with FuncHole.
          Before app work, read funchole://guides/start with resources/read or
          get_funchole_guide(topic='start'). Use search_funchole for task guides
          and tools, get_funchole_tool for one exact schema, and plan_application
          for prerequisites and shipping checks. Read only matching guides.
          Inspect existing components; reuse pinned versions and shared resources.
          Fetch get_function_example before first source submission. Source
          submission replaces all files. Deploy is async: poll to READY or FAILED,
          inspect logs on failure, then fix forward in a new DRAFT. Adoption changes
          live traffic. Verify real HTTPS, not just direct Invocations. Builds and
          handlers are not sandboxed; submit trusted code and keep secrets out of
          source/logs. Native WebSockets, automatic retries, and branching are not
          supplied. Ask for missing external prerequisites rather than inventing
          infrastructure. See funchole://guides/evolve for reuse and project-local
          learning; project notes do not change server security.
        streamable-http:
          mcp-endpoint: /api/mcp

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

server:
  port: ${SERVER_PORT:7080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    flyway:
      access: read_only
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: FuncHole backend bootstrap API
    version: ${APP_VERSION:0.1.0-SNAPSHOT}

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway.autoconfigure: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  nats:
    url: ${NATS_URL:nats://localhost:4222}
  source:
    storage-root: ${SOURCE_STORAGE_ROOT:/tmp/funchole-sources}
    # 'local' (default) stores source on the storage-root path above -
    # durable only if that path is a persistent volume. 's3' stores it in
    # the same S3-compatible bucket already used for build artifacts
    # (app.artifact.* below) instead - see S3SourceStore.
    store-type: ${SOURCE_STORE_TYPE:local}
  artifact:
    endpoint: ${S3_ARTIFACT_ENDPOINT:http://localhost:9000}
    bucket: ${S3_ARTIFACT_BUCKET:funchole-artifacts}
    access-key: ${S3_ARTIFACT_ACCESS_KEY:funchole}
    secret-key: ${S3_ARTIFACT_SECRET_KEY:funchole-secret}
    region: ${S3_ARTIFACT_REGION:us-east-1}
    path-style-access: ${S3_ARTIFACT_PATH_STYLE_ACCESS:true}
  certificate:
    provider: ${CERTIFICATE_PROVIDER:SELF_SIGNED}
    self-signed-validity-days: ${CERTIFICATE_SELF_SIGNED_VALIDITY_DAYS:30}
    retry-delay-ms: ${CERTIFICATE_RETRY_DELAY_MS:60000}
    # Deliberately well below self-signed-validity-days' own default (30) -
    # a renewal window equal to or larger than a cert's own validity period
    # would make it perpetually due for renewal from the moment it's issued.
    renewal-window-days: ${CERTIFICATE_RENEWAL_WINDOW_DAYS:10}
    acme-server-uri: ${CERTIFICATE_ACME_SERVER_URI:https://acme-v02.api.letsencrypt.org/directory}
    acme-poll-interval-seconds: ${CERTIFICATE_ACME_POLL_INTERVAL_SECONDS:3}
    acme-max-poll-attempts: ${CERTIFICATE_ACME_MAX_POLL_ATTEMPTS:20}
  gateway-network:
    # Optional - the Gateway container's own public IPv4 address, shown to
    # users as the target for an apex-domain (A record) custom domain. Leave
    # unset if you don't support apex custom domains yet (CNAME-based
    # subdomain custom domains work regardless).
    public-ip: ${GATEWAY_PUBLIC_IP:}
  security:
    jwt:
      secret: ${JWT_SECRET:ZGV2LXNlY3JldC1mb3ItZnVuY2hvbGUtYmFja2VuZC1jaGFuZ2UtbWUtYmVmb3JlLXByb2QteHl6MTIzNDU2Nzg5MDEyMw==}
      # 30 days - a logged-in browser session (admin dashboard/login) stays
      # valid this long before needing to sign in again. Unrelated to MCP API
      # keys (fh_mcp_... - a separate, revocable, non-expiring mechanism for
      # machine clients, see ApiKeyAuthenticationFilter).
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:2592000}
    bootstrap-user:
      username: ${BOOTSTRAP_USERNAME:admin}
      password: ${BOOTSTRAP_PASSWORD:admin12345}
    api-key:
      # Encrypts MCP API keys at rest (AES-256-GCM, see EncryptionService) so
      # a user can view the full key again later, not just once at creation.
      # Change this before prod - anyone with this secret and DB access can
      # decrypt every stored key.
      encryption-secret: ${API_KEY_ENCRYPTION_SECRET:ZGV2LWFwaS1rZXktZW5jcnlwdGlvbi1zZWNyZXQtY2hhbmdlLW1lLWJlZm9yZS1wcm9k}
  google-auth:
    # Unset by default - "Sign in with Google" stays disabled (GoogleAuthService
    # rejects every attempt with a clear "not configured" error) until both of
    # these are set. Get a Client ID from a Google Cloud OAuth 2.0 "Web
    # application" credential - see docs/development.md.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    # Comma-separated. Only these exact Google account emails may sign in -
    # and always as the one bootstrap admin account above, never as a new one.
    # Not consulted at all when app.cloud-mode.enabled is true (below).
    allowed-emails: ${ADMIN_ALLOWED_GOOGLE_EMAILS:}
  cloud-mode:
    # false (self-hosted default): every package/quota check in
    # PackageLimitService is a no-op and Google sign-in stays scoped to the
    # single allowlisted admin above. true: any verified Google account can
    # self-register (see CloudSignupService), gets the free package, and is
    # subject to its limits on Function/Flow/Gateway/Domain creation.
    enabled: ${CLOUD_MODE_ENABLED:false}
  notifications:
    discord:
      signup-webhook-url: ${DISCORD_SIGNUP_WEBHOOK_URL:}
  tenant-database:
    # A separate Postgres server (not the primary spring.datasource above,
    # which holds FuncHole's own control-plane schema) that every
    # self-registered user's default Database is provisioned on - see
    # TenantDatabaseProvisioningService/CloudSignupService. Isolated
    # deliberately: a tenant's own workload never shares a server with
    # platform data.
    host: ${TENANT_DB_HOST:tenant-db}
    port: ${TENANT_DB_PORT:5432}
    admin-username: ${TENANT_DB_ADMIN_USERNAME:tenant_admin}
    admin-password: ${TENANT_DB_ADMIN_PASSWORD:tenant_admin}
