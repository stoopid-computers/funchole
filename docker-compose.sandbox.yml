# Sandbox mode for tenant code (docs/SANDBOX_ISOLATION_PRD.md, E2). Layer it over the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml build sandbox-image build-image sandbox-manager runtime
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d sandbox-manager controlplane runtime
#
# Needs SANDBOX_MANAGER_TOKEN in .env (a long random secret shared by controlplane and manager).
#
# What changes (1): tenant BUILDS (npm ci / npm run build) stop running inside the controlplane, where
# a malicious postinstall would sit next to every platform secret. The controlplane sends them to the
# sandbox manager, which runs them in locked-down containers as an unprivileged user.
# What changes (2): the runtime worker stops running tenant code in its own Node process. It starts one
# locked-down container per tenant (read-only, no capabilities, no secrets, hard memory/CPU/PID
# limits, gVisor when SANDBOX_RUNTIME=runsc) and speaks to it over stdin/stdout.
#
# STATUS: validated piece by piece (launcher, driver, pool, attack and golden suites against real
# containers). The full compose wiring below is validated in docs/SANDBOX_ISOLATION_PRD.md stage E6
# on a throwaway project before it touches production.
#
# NETWORK GUARD (E3): the sandbox and build networks are only usable behind the egress-guard service,
# which owns firewall rules on the Docker host: private/link-local/metadata ranges, the host itself, other
# tenants' sandboxes, mail ports and stray DNS are blocked, per-sandbox connection and bandwidth limits apply,
# and only the tenant database (and the public internet) is reachable. The rules live in the kernel, so they
# stay in force even if the guard container stops. Set EGRESS_HOST_IPS to this host's public address(es).
#
# KNOWN INTERIM RISKS, closed by later milestones:
#   * The runtime container talks to the host Docker daemon (E7 moves the sandbox zone to its own
#     host so this socket never sits next to platform secrets; until then restrict it with a
#     socket proxy that only allows container create/start/stop/remove).
#   * Egress filtering is a firewall on the Docker host (docker/egress). It is validated against a
#     real Docker host by scripts/egress-test.sh; validate it on the production host in stage E6.

services:
  # Builds the sandbox image on the host's Docker, then exits. Run it before (re)starting runtime.
  sandbox-image:
    image: funchole-sandbox:local
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    entrypoint: ["true"]
    restart: "no"

  # Builds the (untrusted) build image on the host's Docker, then exits.
  build-image:
    image: funchole-build-sandbox:local
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile.build
    entrypoint: ["true"]
    restart: "no"

  # Runs tenant builds. It talks to the Docker daemon, so it holds NO platform credentials, only its
  # own token. Builds run as an unprivileged user (never root), with no capabilities, a read-only
  # root filesystem, hard memory/CPU/PID limits, and none of this container's environment.
  sandbox-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: sandbox-manager
    environment:
      SANDBOX_MANAGER_TOKEN: ${SANDBOX_MANAGER_TOKEN:?Set SANDBOX_MANAGER_TOKEN in your .env file (a long random secret)}
      # Must be a HOST path, mounted at the same path below, because the Docker daemon bind-mounts it into builds.
      SANDBOX_JOBS_DIR: ${SANDBOX_JOBS_DIR:-/var/lib/funchole/sandbox-jobs}
      BUILD_USER: "10001:10001"
      BUILD_IMAGE: funchole-build-sandbox:local
      # Empty = Docker's default runtime; set BUILD_RUNTIME=runsc to build under gVisor.
      BUILD_RUNTIME: ${BUILD_RUNTIME:-}
      BUILD_NETWORK: ${COMPOSE_PROJECT_NAME:-funchole}_build-net
      BUILD_DNS: ${EGRESS_DNS_SERVERS:-8.8.8.8,8.8.4.4}
      BUILD_MEMORY: ${BUILD_MEMORY:-1g}
      BUILD_CPUS: ${BUILD_CPUS:-1}
    volumes:
      - ${SANDBOX_JOBS_DIR:-/var/lib/funchole/sandbox-jobs}:${SANDBOX_JOBS_DIR:-/var/lib/funchole/sandbox-jobs}
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7090/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      build-image:
        condition: service_completed_successfully
      egress-guard:
        condition: service_healthy
    networks:
      - funchole-network

  controlplane:
    environment:
      BUILD_ISOLATION: sandbox
      SANDBOX_MANAGER_URL: http://sandbox-manager:7090
      SANDBOX_MANAGER_TOKEN: ${SANDBOX_MANAGER_TOKEN:?Set SANDBOX_MANAGER_TOKEN in your .env file}
    depends_on:
      sandbox-manager:
        condition: service_healthy

  # Firewall rules for the sandbox and build networks (see docker/egress/egress-guard.sh). Runs on the
  # host network with NET_ADMIN and nothing else. Stopping it does NOT remove the rules (fail closed).
  egress-guard:
    build:
      context: .
      dockerfile: docker/egress/Dockerfile
    image: funchole-egress-guard:local
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    environment:
      EGRESS_NETWORKS: sandbox|fhsbx0|${SANDBOX_NET_SUBNET:-10.213.40.0/24}|${TENANT_DB_SANDBOX_IP:-10.213.40.10}:5432;build|fhbld0|${BUILD_NET_SUBNET:-10.213.41.0/24}|
      EGRESS_HOST_IPS: ${EGRESS_HOST_IPS:-}
      # What sandboxes may query; the same list is given to them as their only DNS (below).
      EGRESS_DNS_SERVERS: ${EGRESS_DNS_SERVERS:-8.8.8.8,8.8.4.4}
      EGRESS_MAX_CONN: ${EGRESS_MAX_CONN:-256}
      EGRESS_BANDWIDTH: ${EGRESS_BANDWIDTH:-30mb/s}
    volumes:
      # So the guard can find the DNS servers Docker really uses (see EGRESS_DNS_SERVERS to set them explicitly).
      - /etc/resolv.conf:/host/resolv.conf:ro
      - /run/systemd/resolve:/host/systemd-resolve:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/egress-guard.sh", "--check"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-worker-sandbox
    environment:
      RUNTIME_ISOLATION: sandbox
      SANDBOX_IMAGE: funchole-sandbox:local
      # runsc = gVisor. Set SANDBOX_RUNTIME= (empty) to fall back to the Docker default runtime.
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runsc}
      # Names as the Docker daemon sees them (compose prefixes them with the project name).
      SANDBOX_NETWORK: ${COMPOSE_PROJECT_NAME:-funchole}_sandbox-net
      SANDBOX_ARTIFACT_VOLUME: ${COMPOSE_PROJECT_NAME:-funchole}_runtime-artifact-cache
      SANDBOX_ARTIFACT_DIR: /tmp/funchole/artifact-cache
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-128m}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
      SANDBOX_PIDS: ${SANDBOX_PIDS:-64}
      # Under gVisor Docker's embedded resolver (127.0.0.11) does not work, so sandboxes get explicit DNS
      # servers (the ones the guard allows) and a fixed entry for the tenant database host.
      SANDBOX_DNS: ${EGRESS_DNS_SERVERS:-8.8.8.8,8.8.4.4}
      # Where the launcher writes each sandbox's resolv.conf: a HOST path mounted at the same path below.
      SANDBOX_STATE_DIR: ${SANDBOX_STATE_DIR:-/var/lib/funchole/sandbox-state}
      SANDBOX_ADD_HOSTS: tenant-db:${TENANT_DB_SANDBOX_IP:-10.213.40.10}
      SANDBOX_MAX_SANDBOXES: ${SANDBOX_MAX_SANDBOXES:-8}
      SANDBOX_IDLE_TTL_SECONDS: ${SANDBOX_IDLE_TTL_SECONDS:-300}
      SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-60}
    volumes:
      # Only the artifact cache is shared with sandboxes (read-only there). The runtime-sockets
      # volume is NOT, because a unix socket stays connectable on a read-only mount.
      - runtime-artifact-cache:/tmp/funchole/artifact-cache
      - ${SANDBOX_STATE_DIR:-/var/lib/funchole/sandbox-state}:${SANDBOX_STATE_DIR:-/var/lib/funchole/sandbox-state}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      egress-guard:
        condition: service_healthy

  # Sandboxes reach the tenant databases here (at a fixed address the guard allows), and nothing else.
  tenant-db:
    networks:
      funchole-network: {}
      sandbox-net:
        ipv4_address: ${TENANT_DB_SANDBOX_IP:-10.213.40.10}

volumes:
  runtime-artifact-cache:

networks:
  # Fixed bridge names and subnets: the guard's firewall rules are written against them.
  sandbox-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fhsbx0
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: ${SANDBOX_NET_SUBNET:-10.213.40.0/24}
  # Builds only: the public internet for the package registry, and nothing else of the platform.
  build-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fhbld0
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: ${BUILD_NET_SUBNET:-10.213.41.0/24}
