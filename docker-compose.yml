x-s3-artifact-env: &s3-artifact-env
  S3_ARTIFACT_ENDPOINT: http://rustfs:9000
  S3_ARTIFACT_BUCKET: ${S3_ARTIFACT_BUCKET:-funchole-artifacts}
  S3_ARTIFACT_ACCESS_KEY: ${S3_ARTIFACT_ACCESS_KEY:?Set S3_ARTIFACT_ACCESS_KEY in your .env file (see .env.example)}
  S3_ARTIFACT_SECRET_KEY: ${S3_ARTIFACT_SECRET_KEY:?Set S3_ARTIFACT_SECRET_KEY in your .env file (see .env.example)}
  S3_ARTIFACT_REGION: ${S3_ARTIFACT_REGION:-us-east-1}
  S3_ARTIFACT_PATH_STYLE_ACCESS: "true"

x-app-secrets-env: &app-secrets-env
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file (see .env.example)}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (see .env.example)}
  BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:?Set BOOTSTRAP_USERNAME in your .env file (see .env.example)}
  BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in your .env file (see .env.example)}
  TENANT_DB_ADMIN_PASSWORD: ${TENANT_DB_ADMIN_PASSWORD:?Set TENANT_DB_ADMIN_PASSWORD in your .env file (see .env.example)}

# Every service gets this - without it, Docker's default json-file log
# driver grows unbounded, which will eventually fill the disk on a VPS with
# nothing else rotating logs. 10MB x 3 files per service is enough for
# recent history/debugging without needing a separate log-shipping stack.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
      target: controlplane
    depends_on:
      db:
        condition: service_healthy
      tenant-db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      nats:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-artifact-env
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /openbao/bootstrap/controlplane-token
      NATS_URL: nats://nats:4222
      # The browser's own origin(s) allowed to call this API cross-origin -
      # comma-separated. Defaults to the local dev web app; production must
      # set this to the real public web origin (e.g. https://app.funchole.dev
      # once ADMIN_WEB_PROXY_HOST is configured) or the login page's fetch
      # calls fail CORS preflight with no Access-Control-Allow-Origin header.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Submitted Function source is stored in the same S3-compatible
      # bucket as build artifacts (app.artifact.* / S3_ARTIFACT_* above),
      # not on this container's own ephemeral disk - see S3SourceStore.
      SOURCE_STORE_TYPE: s3
      # Defaults to a self-signed cert. Set CERTIFICATE_PROVIDER=LETS_ENCRYPT
      # in .env once a real domain's DNS points at this host - the gateway
      # also needs its port 80 reachable from the internet for the HTTP-01
      # challenge (already published below).
      CERTIFICATE_PROVIDER: ${CERTIFICATE_PROVIDER:-SELF_SIGNED}
      # Optional - "Sign in with Google" on the admin login page
      # (localhost:3000/login) stays disabled until both are set. Same
      # Client ID the web service's build arg above uses. See
      # docs/development.md for how to create one.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      ADMIN_ALLOWED_GOOGLE_EMAILS: ${ADMIN_ALLOWED_GOOGLE_EMAILS:-}
      # Optional, cloud product only - false (default) keeps this a normal
      # unlimited self-hosted instance. See docs/development.md before
      # setting this true: it turns on real self-registration (any Google
      # account, not just the allowlist above) and package/quota
      # enforcement. Only the bootstrap admin can create AppDomains once
      # this is true - create and verify at least one domain as the admin
      # first, since every other user's Gateway lands on a randomly chosen
      # one of the admin's verified domains automatically.
      CLOUD_MODE_ENABLED: ${CLOUD_MODE_ENABLED:-false}
      # Optional - posts to this Discord webhook every time CLOUD_MODE_ENABLED
      # self-registration creates a new AppUser. See DiscordNotificationProperties.
      DISCORD_SIGNUP_WEBHOOK_URL: ${DISCORD_SIGNUP_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7080/actuator/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    # No host port mapping: once ADMIN_WEB_PROXY_HOST/CONTROLPLANE_API_PROXY_HOST
    # are configured on the gateway service below, the Gateway is the only
    # public path to this API (real TLS, no plaintext HTTP exposure).
    # Reachable internally on the docker network as controlplane:7080 for
    # the Gateway's proxy, the web container's server-side calls, and this
    # service's own healthcheck above.
    volumes:
      - openbao-data:/openbao:ro
    logging: *default-logging
    networks:
      - funchole-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      controlplane:
        condition: service_healthy
      nats:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-artifact-env
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /openbao/bootstrap/gateway-token
      NATS_URL: nats://nats:4222
      # Optional, cloud product only - reverse-proxies a fixed public
      # hostname straight to the admin web app / controlplane API instead
      # of the normal AppDomain/Flow dispatch, so both are reachable over
      # real HTTPS on this same port 443 without a separate reverse proxy
      # (Caddy/nginx/etc). Either, both, or neither may be set - unset
      # (the self-hosted default) keeps this feature completely inert. See
      # docs/development.md before configuring this.
      ADMIN_WEB_PROXY_HOST: ${ADMIN_WEB_PROXY_HOST:-}
      ADMIN_WEB_PROXY_TARGET: ${ADMIN_WEB_PROXY_TARGET:-web:3000}
      CONTROLPLANE_API_PROXY_HOST: ${CONTROLPLANE_API_PROXY_HOST:-}
      CONTROLPLANE_API_PROXY_TARGET: ${CONTROLPLANE_API_PROXY_TARGET:-controlplane:7080}
      LANDING_PROXY_HOST: ${LANDING_PROXY_HOST:-}
      LANDING_PROXY_TARGET: ${LANDING_PROXY_TARGET:-landing:80}
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:443/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    # Run exactly one gateway replica - see docs/limitations.md ("Gateway is
    # single-instance only") for why a second one would silently drop
    # responses rather than fail over.
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - openbao-data:/openbao:ro
    logging: *default-logging
    networks:
      - funchole-network

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: dispatcher
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      controlplane:
        condition: service_healthy
      nats:
        condition: service_started
      runtime:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /openbao/bootstrap/dispatcher-token
      DB_URL: jdbc:postgresql://db:5432/funchole
      DB_USERNAME: funchole
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file (see .env.example)}
      DEV_RUNTIME_INSTANCE_ID: runtime-node-1
      DEV_RUNTIME_TYPE: NODE
      DEV_RUNTIME_SOCKET_PATH: /tmp/funchole/runtime-node-1.sock
    healthcheck:
      # No HTTP listener exists here to poll - dispatcher touches this file
      # once per poll cycle instead (see DispatcherMain), so a hung/
      # deadlocked loop (still a "running" process) is still detected.
      test: ["CMD-SHELL", "find /tmp/funchole/dispatcher-heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - openbao-data:/openbao:ro
      - runtime-sockets:/tmp/funchole
    logging: *default-logging
    networks:
      - funchole-network

  runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-worker
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-artifact-env
      RUNTIME_INSTANCE_ID: runtime-node-1
      RUNTIME_TYPE: NODE
      RUNTIME_WORKER_SOCKET_PATH: /tmp/funchole/runtime-node-1.sock
      ARTIFACT_STORE_TYPE: s3
      ARTIFACT_CACHE_DIR: /tmp/funchole/artifact-cache
    healthcheck:
      # Same reasoning as dispatcher's - no HTTP listener here either, only
      # a Unix-socket IPC server, so RuntimeWorkerMain writes this file on a
      # fixed interval independent of any actual invocation traffic.
      test: ["CMD-SHELL", "find /tmp/funchole/runtime-heartbeat -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - runtime-sockets:/tmp/funchole
    logging: *default-logging
    networks:
      - funchole-network

  nats:
    image: nats:2.14.6-alpine
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    # No host ports published - only controlplane/gateway/dispatcher need to
    # reach NATS, and they do so over the internal funchole-network. Use
    # `docker exec` or an SSH tunnel if you need to reach it from the host.
    volumes:
      - nats-data:/data
    logging: *default-logging
    networks:
      - funchole-network

  openbao:
    image: docker.io/openbao/openbao:2.6.1
    cap_add:
      - IPC_LOCK
    command: ["server", "-config=/etc/openbao/local.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_API_ADDR: http://openbao:8200
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    # No host port published - OpenBao holds every other service's secrets,
    # so it should only ever be reachable from inside the docker network.
    # Use `docker exec` or an SSH tunnel if you need the UI/API from the host.
    volumes:
      - openbao-data:/openbao
      - ./docker/openbao/local.hcl:/etc/openbao/local.hcl:ro
    logging: *default-logging
    networks:
      - funchole-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        # Same value the controlplane service uses for GOOGLE_OAUTH_CLIENT_ID
        # below - the Client ID isn't secret, so one env var is the source of
        # truth for both sides instead of two that could drift apart.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
        # Build-time only (see Dockerfile) - must be a build arg, not a
        # runtime `environment:` entry below, or it has no effect. The
        # public URL the browser calls the controlplane API at, e.g.
        # https://api-controlplane.funchole.dev once CONTROLPLANE_API_PROXY_HOST
        # is configured on the gateway service. Defaults to the dev value.
        NEXT_PUBLIC_CONTROLPLANE_URL: ${PUBLIC_CONTROLPLANE_URL:-http://localhost:7080}
        # Same build-time-only rule. The web app's own public URL, e.g.
        # https://app.funchole.dev - should match ADMIN_WEB_PROXY_HOST on the
        # gateway service exactly. Empty by default (unset here means no
        # /mcp shortcut is shown, not that anything breaks).
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
        # Same build-time-only rule. Google Analytics measurement ID for the
        # hosted cloud dashboard only; leave unset (the default) to ship no
        # analytics, e.g. on a self-hosted install.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${PUBLIC_GA_MEASUREMENT_ID:-}
    depends_on:
      controlplane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    ports:
      - "3000:3000"
    logging: *default-logging
    networks:
      - funchole-network

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    # No host port mapping - same reasoning as controlplane above: once
    # LANDING_PROXY_HOST is configured on the gateway service, the Gateway
    # is the only public path to this, reachable internally as landing:80.
    logging: *default-logging
    networks:
      - funchole-network

  openbao-init:
    image: curlimages/curl:8.15.0
    depends_on:
      openbao:
        condition: service_started
    environment:
      <<: *app-secrets-env
      BAO_ADDR: http://openbao:8200
      OPENBAO_STATE_DIR: /openbao/bootstrap
    volumes:
      - ./docker/openbao-init/init-openbao.sh:/init-openbao.sh:ro
      - ./docker/openbao-init/secrets:/secrets:ro
      - openbao-data:/openbao
    entrypoint: ["/bin/sh", "/init-openbao.sh"]
    logging: *default-logging
    networks:
      - funchole-network

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${S3_ARTIFACT_ACCESS_KEY:?Set S3_ARTIFACT_ACCESS_KEY in your .env file (see .env.example)}
      RUSTFS_SECRET_KEY: ${S3_ARTIFACT_SECRET_KEY:?Set S3_ARTIFACT_SECRET_KEY in your .env file (see .env.example)}
    volumes:
      - rustfs-data:/data
    logging: *default-logging
    networks:
      - funchole-network

  rustfs-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: rustfs-init
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ARTIFACT_ACCESS_KEY:?Set S3_ARTIFACT_ACCESS_KEY in your .env file (see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${S3_ARTIFACT_SECRET_KEY:?Set S3_ARTIFACT_SECRET_KEY in your .env file (see .env.example)}
      AWS_DEFAULT_REGION: ${S3_ARTIFACT_REGION:-us-east-1}
      S3_ARTIFACT_BUCKET: ${S3_ARTIFACT_BUCKET:-funchole-artifacts}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          echo "Waiting for RustFS..."
          sleep 1
        done

        aws --endpoint-url http://rustfs:9000 s3 mb "s3://$$S3_ARTIFACT_BUCKET" >/dev/null 2>&1 || true
    logging: *default-logging
    networks:
      - funchole-network

  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: funchole
      POSTGRES_USER: funchole
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file (see .env.example)}
    # No host port published - only the app services need to reach Postgres,
    # over the internal funchole-network. Use `docker exec` or an SSH tunnel
    # if you need a direct psql client connection from the host.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funchole -d funchole"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - funchole-network

  # A separate Postgres server, deliberately isolated from the db service
  # above (which holds FuncHole's own control-plane schema) - every
  # self-registered user's auto-provisioned default Database is created
  # here (see TenantDatabaseProvisioningService/CloudSignupService), so a
  # tenant's own workload never shares a server with platform data or can
  # degrade login/API performance. admin_user here is a maintenance-only
  # role controlplane uses solely to run CREATE ROLE/CREATE DATABASE, never
  # for tenant traffic itself.
  tenant-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: tenant_admin
      POSTGRES_PASSWORD: ${TENANT_DB_ADMIN_PASSWORD:?Set TENANT_DB_ADMIN_PASSWORD in your .env file (see .env.example)}
    # No host port published - same reasoning as db above.
    volumes:
      - tenant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - funchole-network

volumes:
  postgres-data:
  tenant-postgres-data:
  openbao-data:
  nats-data:
  rustfs-data:
  runtime-sockets:

networks:
  funchole-network:
    driver: bridge
